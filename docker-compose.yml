version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: htconnect-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ht_connect
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - htconnect
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ht_connect?schema=public
      JWT_SECRET: super-secret-key
      JWT_EXPIRES_IN: 1d
      PORT: 4000
      FRONTEND_URL: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '4000:4000'
    networks:
      - htconnect

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://backend:4000/api
    depends_on:
      - backend
    ports:
      - '8080:80'
    networks:
      - htconnect

networks:
  htconnect:
    driver: bridge

volumes:
  postgres_data:
